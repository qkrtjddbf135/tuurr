name: Build SURVIVOR for Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Build onedir Windows application
        shell: pwsh
        run: |
          $buildArgs = @(
            '--noconfirm',
            '--clean',
            '--onedir',
            '--windowed',
            '--name', 'SURVIVOR',
            '--contents-directory', '_internal',
            '--collect-all', 'pygame'
          )
          if (Test-Path 'fonts/neodgm.ttf') {
            $buildArgs += @('--add-data', 'fonts/neodgm.ttf;fonts')
          }
          $buildArgs += 'main.py'
          python -m PyInstaller @buildArgs

      - name: Verify executable layout and create ZIP
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/SURVIVOR/SURVIVOR.exe')) {
            throw 'SURVIVOR.exe was not created.'
          }
          if (!(Test-Path 'dist/SURVIVOR/_internal')) {
            throw '_internal folder was not created.'
          }
          Compress-Archive -Path 'dist/SURVIVOR/*' -DestinationPath 'dist/SURVIVOR-Windows.zip' -CompressionLevel Optimal -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: SURVIVOR-Windows
          path: dist/SURVIVOR-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach ZIP to published GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" "dist/SURVIVOR-Windows.zip" --clobber
